[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medbot-assist"
version = "0.1.0"
description = "Safe perception-to-plan integration for simulated instrument tray handling"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
ml = ["torch>=2.6"]

[project.scripts]
medbot-assist = "medbot_assist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
